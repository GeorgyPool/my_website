{% extends 'catalog/base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for info in products %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ info.image.url }}">
                    <div class="card-body"><p class="card-text">{{ info.name_product }}</p>
                        <p class="card-text">{{ info.descriptions }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="p-2 btn btn-light" href="/product_detail/{{ info.id }}" role="button">Подробнее</a>
                            </div>
                            <small class="text-body-secondary"></small></div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
