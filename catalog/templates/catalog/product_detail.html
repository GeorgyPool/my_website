{% extends 'catalog/base.html' %}

{% block title %}Подробно{% endblock %}

{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ product_detail.image.url }}">
                    <div class="card-body"><p class="card-text text-warning">Название: {{ product_detail.name_product }}</p>
                        <p class="card-text ">Описание: {{ product_detail.descriptions }}</p>
                        <p class="card-text">Категория: {{ product_detail.category }}</p>
                        <p class="card-text">Цена: {{ product_detail.purchase_price }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                            </div>
                        </div>
                        <a class="p-2 btn btn-light" href="/" role="button">назад</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% endblock %}
