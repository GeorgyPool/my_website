{% extends 'catalog/base.html' %}

{% block title %}Ве категории{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center">
    <div class="card mt-5 bg-dark">
        {% for info in all_category %}
        <a class="p-2 btn btn-outline-warning mt-2" role="button" href="{% url 'catalog:all_product_category' info.pk %}">{{ info.name_category }}</a>
        {% endfor %}
    </div>
</div>

{% endblock %}
