{% extends 'catalog/base.html' %}

{% block title %}Удаление: {{ product.name_product }}{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center">
    <h1>Вы действительно желаете удалить: {{ product.name_product }}</h1>
</div>

<div class="container d-flex justify-content-center">
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-outline-danger" type="submit">Удалить</button>
    </form>
</div>

{% endblock %}
