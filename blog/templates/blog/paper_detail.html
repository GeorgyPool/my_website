{% extends 'blog/include/base.html' %}

{% block title %}Подробно о: {{ paper.title }}{% endblock %}


{% block content %}

<div class="row text-center mt-5">
    <h1 class="text-white">{{ paper.title }}:</h1>
</div>

<div class="row">
    <div class="col-12">
        <ul class="group">
            <li class="group-item">
                <a href="{% url 'blog:update' paper.pk %}" class="btn btn-primary">Редактировать</a>
                <a href="{% url 'blog:delete' paper.pk %}" class="btn btn-danger">Удалить</a>
            </li>
        </ul>
    </div>
</div>

<div class="container mt-5 d-flex justify-content-center">
    <div class="card">
        <div class="card-body">
            {% if paper.preview %}
            <img src="{{ paper.preview.url }}" alt="..." class="w-25">
            {% else %}
            <h4 class="text-center">Изображение не найдено</h4>
            {% endif %}
        </div>
    </div>
</div>

<div class="container mt-5">
    <div class="card">
        <div class="card-body bg-secondary bg-gradient">
            <p>{{ paper.text }}</p>
        </div>
    </div>
</div>

{% endblock %}
